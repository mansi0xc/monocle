[workspace]
members = ["crates/monocle-wasm", "experiments/bls-compat", "crates/monocle-core", "experiments/contracts-compat", "tools/certificate-fixtures", "experiments/certificate-compat", "experiments/finality-compat"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.91.1"
publish = false

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
panic = "abort"
