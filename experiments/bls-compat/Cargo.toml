[package]
name = "monocle-bls-compat"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
solana-bls-signatures = { version = "=4.0.0", default-features = false }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
hex = "=0.4.3"

# Verification is deterministic. The probe never asks a browser for entropy.
# If a dependency unexpectedly requests randomness, fail closed (do not return zeros).
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "=0.2.16", features = ["custom"] }

[dev-dependencies]
wincode = { version = "=0.6.1", features = ["derive"] }
